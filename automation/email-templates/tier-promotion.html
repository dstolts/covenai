<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You've reached {{TIER_NAME}}!</title>
<!--
  CovenAI Tier Promotion Email
  Subject: You've reached {{TIER_NAME}}!
  Variables: {{USER_NAME}}, {{OLD_TIER}}, {{OLD_TIER_COLOR}}, {{NEW_TIER}}, {{TIER_NAME}}, {{NEW_TIER_COLOR}}, {{REWARDS_HTML}}, {{PROFILE_URL}}, {{UNSUBSCRIBE_URL}}
  Sent via: Resend
-->
</head>
<body style="margin:0; padding:0; background-color:#1E293B; font-family:Arial, Helvetica, sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#1E293B;">
<tr>
<td align="center" style="padding:20px 10px;">

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px; background-color:#0F172A; border-radius:8px; overflow:hidden;">

<!-- Header -->
<tr>
<td style="background-color:#5B21B6; padding:32px 24px; text-align:center;">
<h1 style="margin:0; color:#FFFFFF; font-size:28px; font-weight:700; letter-spacing:0.5px;">CovenAI</h1>
<p style="margin:8px 0 0 0; color:#F59E0B; font-size:14px; font-weight:600; letter-spacing:1px;">BUILD WITH AI. EARN YOUR RANK.</p>
</td>
</tr>

<!-- Main Content -->
<tr>
<td style="padding:32px 24px;">

<p style="margin:0 0 8px 0; color:#94A3B8; font-size:14px;">Hey {{USER_NAME}},</p>
<h2 style="margin:0 0 24px 0; color:#F59E0B; font-size:24px; font-weight:700;">You've been promoted!</h2>

<!-- Tier Change Visual -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 32px 0;">
<tr>
<td width="42%" style="text-align:center; padding:16px; background-color:#1E293B; border-radius:8px;">
<p style="margin:0 0 4px 0; color:#94A3B8; font-size:11px; text-transform:uppercase; letter-spacing:1px;">Previous</p>
<div style="display:inline-block; width:48px; height:48px; border-radius:50%; background-color:{{OLD_TIER_COLOR}}; line-height:48px; text-align:center; font-size:20px; font-weight:700; color:#FFFFFF;">{{OLD_TIER}}</div>
<p style="margin:8px 0 0 0; color:#CBD5E1; font-size:14px; font-weight:600;">{{OLD_TIER}}</p>
</td>
<td width="16%" style="text-align:center; vertical-align:middle;">
<span style="color:#F59E0B; font-size:24px; font-weight:700;">&rarr;</span>
</td>
<td width="42%" style="text-align:center; padding:16px; background-color:#1E293B; border-radius:8px; border:2px solid #F59E0B;">
<p style="margin:0 0 4px 0; color:#F59E0B; font-size:11px; text-transform:uppercase; letter-spacing:1px;">New Tier</p>
<div style="display:inline-block; width:48px; height:48px; border-radius:50%; background-color:{{NEW_TIER_COLOR}}; line-height:48px; text-align:center; font-size:20px; font-weight:700; color:#FFFFFF;">{{NEW_TIER}}</div>
<p style="margin:8px 0 0 0; color:#FFFFFF; font-size:14px; font-weight:700;">{{TIER_NAME}}</p>
</td>
</tr>
</table>

<!-- Rewards Unlocked -->
<h3 style="margin:0 0 12px 0; color:#FFFFFF; font-size:16px; font-weight:600;">Rewards Unlocked</h3>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 32px 0; background-color:#1E293B; border-radius:8px; padding:16px;">
<tr>
<td style="padding:16px; color:#CBD5E1; font-size:14px; line-height:1.8;">
{{REWARDS_HTML}}
</td>
</tr>
</table>

<!-- CTA Button -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0">
<tr>
<td align="center">
<a href="{{PROFILE_URL}}" style="display:inline-block; background-color:#5B21B6; color:#FFFFFF; text-decoration:none; font-size:16px; font-weight:600; padding:14px 32px; border-radius:6px;">View your profile</a>
</td>
</tr>
</table>

</td>
</tr>

<!-- Footer -->
<tr>
<td style="padding:24px; border-top:1px solid #334155; text-align:center;">
<p style="margin:0 0 8px 0; color:#64748B; font-size:12px;">CovenAI - Build with AI. Earn your rank. | covenai.co</p>
<a href="{{UNSUBSCRIBE_URL}}" style="color:#64748B; font-size:12px; text-decoration:underline;">Unsubscribe</a>
</td>
</tr>

</table>

</td>
</tr>
</table>
</body>
</html>
